name: CI

# The `changes` job classifies what a run changed (.github/actions/changes). `validate` always runs;
# it is the lint gate and takes seconds. PHPUnit is skipped when only documentation changed.
# A newer commit on the same pull request cancels the older run.

on:
  push:
  pull_request:
  # Weekly, Monday: the whole suite on master, and the check that the branch rules on GitHub
  # are the ones in .github/rulesets/master.json.
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

# Every job only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

# A newer push to the same pull request cancels its run in progress. Every other run (push to master,
# tag, manual) gets a group of its own: GitHub keeps only one pending run per group, so a shared
# group would cancel a pending master run whose changes the next run never classifies again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # pull_request: the merge commit and both parents; push: the pushed range
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: changes
        uses: ./.github/actions/changes

  # ---------------------------------------------------------------------------
  # Static validation: store readiness, coding standards, deprecations, lint.
  # Mirrors `shopware-cli extension validate` from local. Primary gate.
  # ---------------------------------------------------------------------------
  validate:
    name: shopware-cli validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # NOTE: verify the action reference against https://sw-cli.fos.gg/
      - name: Setup shopware-cli
        uses: shopware/shopware-cli-action@72d5fa2c934424f3b1360ccae288aa304b91a4c9 # v1.0.6

      - name: Validate extension (basic + store compliance)
        run: |
          shopware-cli extension validate .
          shopware-cli extension validate --store-compliance .

      # Full static analysis (PHPStan/ESLint/Stylelint). Currently only reports
      # 3 forward-looking 6.8 deprecations, so it must not fail the build.
      - name: Full validation (non-blocking)
        continue-on-error: true
        run: shopware-cli extension validate --full .

  # ---------------------------------------------------------------------------
  # PHPUnit against a real Shopware 6.7. dockware is started as a normal
  # container (via its own entrypoint), which extracts Shopware, starts MySQL
  # and becomes "healthy" — exactly like the local dev container. Then we
  # docker-exec into it. (Using dockware as a GitHub `container:` does NOT work,
  # because Actions overrides the entrypoint and Shopware stays as a .tar.zst.)
  # ---------------------------------------------------------------------------
  phpunit:
    name: PHPUnit (Shopware 6.7)
    needs: changes
    # Runs unless the run was cancelled: a failed classification must not skip the tests, because a
    # skipped job counts as passed for required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: LedgerDirect

      # Docker Hub counts anonymous pulls per IP, and GitHub-hosted runners share
      # theirs with everyone, so the dockware pull failed at random with
      # "toomanyrequests". Logged in, it counts against the organisation's account.
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start dockware (Shopware 6.7 + DB)
        run: |
          # If this exact tag is unavailable, use dockware/shopware:6.7.13.0
          docker run -d --name shopware dockware/shopware:6.7-latest
          echo "Waiting for Shopware to become healthy..."
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' shopware 2>/dev/null || echo starting)"
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          docker exec shopware test -f /var/www/html/bin/console

      - name: Copy plugin into the container
        run: |
          docker exec shopware mkdir -p /var/www/html/custom/plugins
          docker cp LedgerDirect shopware:/var/www/html/custom/plugins/LedgerDirect

      # plugin:install pulls hardcastle/ledger-direct-core from Packagist on its
      # own: the plugin declares it as a composer requirement and opts into
      # Shopware running composer at install time.
      - name: Install Mockery and activate the plugin
        run: |
          docker exec shopware bash -lc 'cd /var/www/html && COMPOSER_ALLOW_SUPERUSER=1 composer require --dev --no-interaction mockery/mockery'
          docker exec shopware bash -lc 'cd /var/www/html && php bin/console plugin:refresh && php bin/console plugin:install --activate LedgerDirect && php bin/console cache:clear'

      - name: PHPUnit — Unit
        run: docker exec shopware bash -lc 'cd /var/www/html/custom/plugins/LedgerDirect && /var/www/html/vendor/bin/phpunit --testsuite Unit'

      - name: PHPUnit — Integration
        run: docker exec shopware bash -lc 'cd /var/www/html/custom/plugins/LedgerDirect && /var/www/html/vendor/bin/phpunit --testsuite Integration'

  # Weekly and on demand: the ruleset GitHub enforces on master is the one in .github/rulesets/master.json.
  # Not part of "CI passed": a pull request that changes the file differs from GitHub until the
  # ruleset is applied after the merge.
  ruleset:
    name: Branch rules match .github/rulesets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare the ruleset on GitHub with the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/rulesets/check.sh "${{ github.repository }}" .github/rulesets/master.json

  # The one check a merge into master requires. Its name is in .github/rulesets/master.json: renaming the
  # job blocks every merge until the ruleset on GitHub is changed too. A job's own name changes with
  # its matrix and shows unexpanded when the job is skipped, so the branch rules name this job
  # instead. Skipped on purpose (a documentation-only pull request) counts as passed; failed or
  # cancelled does not. always(), not !cancelled(): a skipped job counts as passed, so this job has
  # to run and report in every case.
  passed:
    name: CI passed
    needs: [changes, validate, phpunit]
    if: always()
    runs-on: ubuntu-latest
    # Reads this run's job list, nothing else.
    permissions:
      actions: read
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          # Jobs this check leaves out, by the start of their name: the weekly ruleset check, not in needs
          UNGATED: '["Branch rules match"]'
        # needs.<job>.result can say "success" for a matrix one of whose legs was cancelled before a
        # runner took it (https://github.com/orgs/community/discussions/211624), so every finished job
        # of this run, each matrix leg on its own, is checked as well, except the ones in UNGATED:
        # whether they are finished at this point is a matter of timing.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          gh api "$JOBS" > jobs.json
          jq --argjson ungated "$UNGATED" '[.jobs[] | select(.status == "completed")
            | select(.name as $n | $ungated | any(. as $p | $n | startswith($p)) | not)]' jobs.json > gated.json
          jq -r '.[] | "\(.name): \(.conclusion)"' gated.json
          jq -e 'all(.[]; .conclusion == "success" or .conclusion == "skipped")' gated.json > /dev/null
