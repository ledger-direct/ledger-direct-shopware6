# yaml-language-server: $schema=https://raw.githubusercontent.com/symfony/dependency-injection/7.4/Loader/schema/services.schema.json
services:
    Hardcastle\LedgerDirect\Command\XrplTransactionLookupCommand:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Xrpl\XrplClient'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
            - '@Hardcastle\LedgerDirect\Port\DbalStellarPaymentRepository'
            - '@ledger_direct.xahau.client'
        tags:
            - console.command

    Hardcastle\LedgerDirect\Command\XrpPriceLookupCommand:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Price\PriceService'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
        tags:
            - console.command

    Hardcastle\LedgerDirect\Command\XrplTransactionSyncCommand:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Xrpl\SyncService'
            - '@Hardcastle\LedgerDirect\Port\DbalXrplTransactionRepository'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
            - '@Hardcastle\LedgerDirect\Core\Stellar\SyncService'
            - '@Hardcastle\LedgerDirect\Port\DbalStellarPaymentRepository'
            - '@ledger_direct.xahau.sync'
            - '@ledger_direct.xahau.transaction_repository'
        tags:
            - console.command

    Hardcastle\LedgerDirect\ScheduledTask\SettleOpenTransactionsTask:
        tags:
            - shopware.scheduled.task

    Hardcastle\LedgerDirect\ScheduledTask\SettleOpenTransactionsTaskHandler:
        arguments:
            - '@scheduled_task.repository'
            - '@logger'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
        tags:
            - messenger.message_handler

    Hardcastle\LedgerDirect\Api\PaymentInfoController:
        public: true
        arguments:
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Core\Payment\SettlementPolicy'
        calls:
            - [setContainer, ['@service_container']]

    Hardcastle\LedgerDirect\Storefront\Controller\XrpPriceAggregatorController:
        public: true
        calls:
            - [setContainer, ['@service_container']]

    Hardcastle\LedgerDirect\Storefront\Controller\XrplPaymentController:
        public: true
        arguments:
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\SalesChannel\PaymentRoute'
            - '@Hardcastle\LedgerDirect\Core\Payment\SettlementPolicy'
            - '@Hardcastle\LedgerDirect\Service\OrderAccessGuard'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\PaymentRedirect'
            - '@Hardcastle\LedgerDirect\Presentation\PaymentPageView'
            - '@Hardcastle\LedgerDirect\Presentation\PageLogo'
        calls:
            - [setContainer, ['@service_container']]

    Hardcastle\LedgerDirect\Components\PaymentHandler\XrplPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    # The three XRPL methods keep their original handler identifiers; the classes are the chain handler.
    Hardcastle\LedgerDirect\Components\PaymentHandler\XrpPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    Hardcastle\LedgerDirect\Components\PaymentHandler\RlusdPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    Hardcastle\LedgerDirect\Components\PaymentHandler\UsdcPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    Hardcastle\LedgerDirect\Port\ShopwareConfigProvider:
        arguments:
            - '@Hardcastle\LedgerDirect\Service\ConfigurationService'

    # Keeps a payment method whose chain or asset is switched off out of the checkout.
    Hardcastle\LedgerDirect\Checkout\PaymentMethodRouteDecorator:
        decorates: Shopware\Core\Checkout\Payment\SalesChannel\PaymentMethodRoute
        arguments:
            - '@.inner'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
            - '@Hardcastle\LedgerDirect\Core\Stellar\AccountInspector'
            - '@Hardcastle\LedgerDirect\Chain\InterledgerGateway'
            - '@logger'

    # Refuses a receiving account that is not one, the moment it is saved.
    Hardcastle\LedgerDirect\Service\ConfigurationValidator:
        arguments:
            - '@Hardcastle\LedgerDirect\Service\ConfigurationService'
            - '@logger'
        tags:
            - kernel.event_subscriber

    Hardcastle\LedgerDirect\Installer\PaymentMethodInstaller:
        arguments:
            - '@payment_method.repository'
            - '@Shopware\Core\Framework\Plugin\Util\PluginIdProvider'

    Hardcastle\LedgerDirect\Service\PreviewChainActivator:
        arguments:
            - '@Hardcastle\LedgerDirect\Installer\PaymentMethodInstaller'
            - '@logger'
        tags:
            - kernel.event_subscriber

    Hardcastle\LedgerDirect\Port\DbalXrplTransactionRepository:
        arguments:
            - '@Doctrine\DBAL\Connection'

    Hardcastle\LedgerDirect\Port\DbalStellarPaymentRepository:
        arguments:
            - '@Doctrine\DBAL\Connection'

    # Stellar: the sibling stack of the XRPL services below, wired the same way.
    Hardcastle\LedgerDirect\Core\Stellar\HorizonClient:
        arguments:
            - '@shopware.app_system.guzzle'
            - '@GuzzleHttp\Psr7\HttpFactory'

    Hardcastle\LedgerDirect\Core\Stellar\SyncService:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Stellar\HorizonClient'
            - '@Hardcastle\LedgerDirect\Port\DbalStellarPaymentRepository'
            - '@logger'

    Hardcastle\LedgerDirect\Core\Stellar\MemoIdService:
        arguments:
            - '@Hardcastle\LedgerDirect\Port\DbalStellarPaymentRepository'

    Hardcastle\LedgerDirect\Core\Stellar\PaymentIntentService:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Price\PriceService'
            - '@Hardcastle\LedgerDirect\Core\Stellar\MemoIdService'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'

    # The cache is not optional here: without it every checkout asks Horizon for the trust line (3600 requests/h/IP).
    Hardcastle\LedgerDirect\Core\Stellar\AccountInspector:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Stellar\HorizonClient'
            - '@logger'
            - '@ledger_direct.rate_cache'

    # Interledger: the preview chain whose services come from the optional package
    # hardcastle/ledger-direct-interledger. Only this gateway is a service — it names
    # none of the package's classes in its constructor, so it is safe to build in an
    # installation that does not have the package. See Chain\InterledgerGateway.
    Hardcastle\LedgerDirect\Chain\InterledgerGateway:
        arguments:
            - '@Hardcastle\LedgerDirect\Service\ConfigurationService'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
            - '@shopware.app_system.guzzle'
            - '@GuzzleHttp\Psr7\HttpFactory'
            - '@Doctrine\DBAL\Connection'
            - '@ledger_direct.rate_cache'
            - '@logger'

    Hardcastle\LedgerDirect\Components\PaymentHandler\InterledgerPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    Hardcastle\LedgerDirect\Components\PaymentHandler\StellarPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    # Xahau: the XRPL classes again, with the chain as their last argument. Its own
    # tables, node, tag counter and throttle; nothing is shared with the XRP Ledger.
    ledger_direct.xahau.transaction_repository:
        class: Hardcastle\LedgerDirect\Port\DbalXrplTransactionRepository
        arguments:
            - '@Doctrine\DBAL\Connection'
            - 'XAHAU'

    ledger_direct.xahau.client:
        class: Hardcastle\LedgerDirect\Core\Xrpl\XrplClient
        arguments:
            - '@shopware.app_system.guzzle'
            - '@GuzzleHttp\Psr7\HttpFactory'
            - '@GuzzleHttp\Psr7\HttpFactory'
            - 'XAHAU'

    # The cache remembers a testnet reset, so only the first sync after one sends a failing request.
    ledger_direct.xahau.sync:
        class: Hardcastle\LedgerDirect\Core\Xrpl\SyncService
        arguments:
            - '@ledger_direct.xahau.client'
            - '@ledger_direct.xahau.transaction_repository'
            - '@logger'
            - '@ledger_direct.rate_cache'
            - 'XAHAU'

    ledger_direct.xahau.destination_tags:
        class: Hardcastle\LedgerDirect\Core\Xrpl\DestinationTagService
        arguments:
            - '@ledger_direct.xahau.transaction_repository'

    ledger_direct.xahau.intents:
        class: Hardcastle\LedgerDirect\Core\Payment\PaymentIntentService
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Price\PriceService'
            - '@ledger_direct.xahau.destination_tags'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'
            - ~
            - 'XAHAU'

    # The same r-address is valid on both chains, so Xahau's sync marks must not be the XRP Ledger's.
    ledger_direct.xahau.sync_throttle:
        class: Hardcastle\LedgerDirect\Core\Xrpl\SyncThrottle
        arguments:
            - '@ledger_direct.rate_cache'
            - '@logger'
            - !php/const Hardcastle\LedgerDirect\Core\Payment\PaymentStatus::MIN_SYNC_INTERVAL_SECONDS
            - ~
            - 'XAHAU'

    Hardcastle\LedgerDirect\Components\PaymentHandler\XahauPaymentHandler:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'
        tags:
            - shopware.payment.method

    GuzzleHttp\Psr7\HttpFactory: ~

    ledger_direct.rate_cache:
        class: Symfony\Component\Cache\Psr16Cache
        arguments:
            - '@cache.object'

    Hardcastle\LedgerDirect\Core\Payment\SettlementPolicy: ~

    Hardcastle\LedgerDirect\Core\Price\PriceService:
        arguments:
            - '@shopware.app_system.guzzle'
            - '@GuzzleHttp\Psr7\HttpFactory'
            - '@logger'
            - '@ledger_direct.rate_cache'

    Hardcastle\LedgerDirect\Core\Xrpl\DestinationTagService:
        arguments:
            - '@Hardcastle\LedgerDirect\Port\DbalXrplTransactionRepository'

    Hardcastle\LedgerDirect\Core\Payment\PaymentIntentService:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Price\PriceService'
            - '@Hardcastle\LedgerDirect\Core\Xrpl\DestinationTagService'
            - '@Hardcastle\LedgerDirect\Port\ShopwareConfigProvider'

    Hardcastle\LedgerDirect\Core\Xrpl\XrplClient:
        arguments:
            - '@shopware.app_system.guzzle'
            - '@GuzzleHttp\Psr7\HttpFactory'
            - '@GuzzleHttp\Psr7\HttpFactory'

    # The cache remembers a testnet reset, so only the first sync after one sends a failing request.
    Hardcastle\LedgerDirect\Core\Xrpl\SyncService:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Xrpl\XrplClient'
            - '@Hardcastle\LedgerDirect\Port\DbalXrplTransactionRepository'
            - '@logger'
            - '@ledger_direct.rate_cache'
            - 'XRPL'

    Hardcastle\LedgerDirect\Core\Xrpl\SyncThrottle:
        arguments:
            - '@ledger_direct.rate_cache'
            - '@logger'

    Hardcastle\LedgerDirect\SalesChannel\PaymentRoute:
        public: true
        arguments:
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Service\OrderAccessGuard'
            - '@Hardcastle\LedgerDirect\Core\Payment\SettlementPolicy'
            - '@Hardcastle\LedgerDirect\Service\PaymentStateService'
            - '@Hardcastle\LedgerDirect\Service\PaymentRedirect'
            - '@Hardcastle\LedgerDirect\Presentation\PaymentPageView'

    Hardcastle\LedgerDirect\Presentation\PaymentPageView:
        arguments:
            - '@Hardcastle\LedgerDirect\Core\Payment\SettlementPolicy'
            - '@Hardcastle\LedgerDirect\Service\ConfigurationService'

    Hardcastle\LedgerDirect\Presentation\PageLogo:
        arguments:
            - '@Hardcastle\LedgerDirect\Service\ConfigurationService'
            - '@media.repository'

    Hardcastle\LedgerDirect\Service\ConfigurationService:
        arguments:
            - '@Shopware\Core\System\SystemConfig\SystemConfigService'
            - '@logger'

    Hardcastle\LedgerDirect\Service\OrderAccessGuard:
        arguments:
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'

    Hardcastle\LedgerDirect\Service\PaymentStateService:
        arguments:
            - '@Shopware\Core\Checkout\Order\Aggregate\OrderTransaction\OrderTransactionStateHandler'
            - '@Hardcastle\LedgerDirect\Service\OrderTransactionService'
            - '@Hardcastle\LedgerDirect\Core\Payment\SettlementPolicy'
            - '@logger'

    Hardcastle\LedgerDirect\Service\PaymentRedirect:
        arguments:
            - '@router'
            - '@Hardcastle\LedgerDirect\Service\HeadlessTargets'

    Hardcastle\LedgerDirect\Service\HeadlessTargets:
        arguments:
            - '@Hardcastle\LedgerDirect\Service\ConfigurationService'

    Hardcastle\LedgerDirect\Service\OrderTransactionService:
        arguments:
            - '@order.repository'
            - '@order_transaction.repository'
            - '@currency.repository'
            - '@Hardcastle\LedgerDirect\Core\Payment\PaymentIntentService'
            - '@Hardcastle\LedgerDirect\Core\Xrpl\SyncService'
            - '@Hardcastle\LedgerDirect\Core\Stellar\PaymentIntentService'
            - '@Hardcastle\LedgerDirect\Core\Stellar\SyncService'
            - '@Hardcastle\LedgerDirect\Chain\InterledgerGateway'
            - '@Hardcastle\LedgerDirect\Core\Xrpl\SyncThrottle'
            - '@logger'
            - '@ledger_direct.xahau.intents'
            - '@ledger_direct.xahau.sync'
            - '@ledger_direct.xahau.sync_throttle'
