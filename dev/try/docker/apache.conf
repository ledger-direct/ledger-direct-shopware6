# dockware's virtual hosts without its developer tools (Adminer with the database's root login, the
# log viewer, Mailcatcher): the try shop publishes the storefront and the administration, nothing else.
# dockware's entrypoint fills in the two __dockware_…__ placeholders on every start.
<VirtualHost *:80>
    ServerAdmin local@dockware
    ErrorLog /var/log/apache2/error.log
    AccessFileName .htaccess

    DocumentRoot __dockware_apache_docroot__
    <Directory __dockware_apache_docroot__>
        Options -Indexes
        AllowOverride All
        Require all granted
        CGIPassAuth On
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php__dockware_php_version__-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>

# https with dockware's self-signed certificate: browsers upgrade localhost to https on their own, and
# the shop answers there too (see the https domains in setup.php).
<VirtualHost *:443>
    ServerAdmin local@dockware
    ErrorLog /var/log/apache2/error.log
    AccessFileName .htaccess

    SSLEngine On
    SSLCertificateFile /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/server.key
    Protocols h2 h2c http/1.1

    DocumentRoot __dockware_apache_docroot__
    <Directory __dockware_apache_docroot__>
        Options -Indexes
        AllowOverride All
        Require all granted
        CGIPassAuth On
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php__dockware_php_version__-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
