# CodeRabbit configuration. Background and the review routine:
# LedgerDirect-CodeRabbit-Review-Ablauf (maintainer notes), skill coderabbit-loop.
# Pull requests without an automatic review, each opted out on its own with "@coderabbitai ignore"
# at the end of its description:
# - release-only, titled "task: release <version>" (version and CHANGELOG heading, no code);
# - documentation-only, titled "docs: ..." (Markdown, docs/, readme.txt, README screenshots;
#   nothing else). This decides the review only; CI classifies on its own (.github/** rule below).
# Dependabot pull requests skip it through ignore_usernames. There is no ignore_title_keywords: it
# matches a keyword anywhere in the title, case-insensitive and not as a prefix, so a title like
# "fix: task: release parser" or "fix: docs: links in the error page" would skip a real review.
# Ask with `@coderabbitai review` to have any opted-out pull request reviewed.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
    - .*
    auto_pause_after_reviewed_commits: 5
    ignore_usernames:
    - dependabot[bot]
  path_instructions:
  - path: '**'
    instructions: |
      Payment behaviour is defined by the LedgerDirect core contract, not by this plugin:
      INVARIANTS.md in ledger-direct/ledger-direct-core-php (payment intent, payment
      status, settlement policy, throttling, refusals). The plugin is an adapter.
      - Judge payment states, amounts, tolerances, status payloads and refusals against
        that contract. Name the section a finding relies on.
      - Parity: the LedgerDirect plugins for Magento, Shopware, PrestaShop and
        WooCommerce must answer alike (same status fields, same states, same refusal
        codes and bodies, e.g. 403 {"error":"forbidden"}). A divergence from another
        plugin is a valid finding; name that plugin.
      - Being stricter than the contract is not a goal. Do not propose behaviour the
        contract does not ask for.
      - Testnet/mainnet: never suggest mainnet defaults; never accept seeds, secrets or
        private keys in code, fixtures, logs or docs.
  - path: src/**
    instructions: |-
      Shopware 6.6.5 and 6.7 plugin (PHP 8.2+), store-ready: `shopware-cli extension validate
      --full` and `--store-compliance` must pass. Storefront and Store API routes;
      headless front ends use the Store API. Cache-dependent features (throttle, rate
      cache) assume `framework.cache.app: cache.adapter.filesystem` in tests.
      Preview chains (Stellar, Interledger) stay invisible until the merchant enables them.
  - path: tests/**
    instructions: |
      Tests (PHPUnit). A test must fail without the change it covers.
      Do not ask for tests of trivial getters or framework glue. Network access in unit
      tests is a defect.
  - path: dev/**
    instructions: |
      Developer and demo tooling: the try stack (docker compose, one-command shop on the
      XRPL testnet for prospects), CI helpers and manual-test scripts. Not shop runtime
      code and not shipped in the release package.
      Review for: state and reset (named volumes, `down -v` is the reset, never wipe an
      installed shop silently, settings re-applied on every start, image updates
      detected), reproducibility (pinned image tags and versions), ports bound to
      127.0.0.1, database not published, testnet only, no seeds or keys in files or logs.
      Do not ask for production hardening (TLS, process managers, secrets managers).
  - path: .github/**
    instructions: |
      GitHub Actions. Existing merge gates must keep working for fork pull requests
      (secrets are absent there). Pin third-party actions by major version at least.
      Publishing stays gated. Where a repository publishes the try image: the repository variable
      LD_PUBLISH_TRY_IMAGE plus either a pushed version tag or a manual run with "publish" (which
      may also tag ":latest" on purpose). Publishing a release (GitHub release, store or registry
      upload) runs on a pushed version tag only; building a release archive as a check may run on
      every change.
      Jobs are gated by the "changes" job (.github/actions/changes). When it reports docs_only=true
      (every changed file is Markdown, docs/, a changelog, the licence, readme.txt, the CodeRabbit
      config or GitHub metadata, and none was deleted), only the lint job runs (Shopware:
      shopware-cli validate; the core has no lint job, so only "changes" runs). Images outside
      docs/ such as payment_page.png and every deletion run the full suite. The try stack runs only
      when something the shop runs may have changed, and a failed classification runs everything.
      The action and the gating are the same in every LedgerDirect plugin repository and the core;
      a change to the pattern belongs in all of them, not in a per-repository variant or a
      third-party path filter.
  - path: src/Resources/app/storefront/dist/**
    instructions: |
      Verbatim copy of @ledger-direct/payment-ui (github.com/ledger-direct/ledger-direct-payment-ui),
      built there and copied here unchanged; the VERSION file names the release.
      Review provenance only: does VERSION match the files, were they changed by hand?
      Do not review the code itself; findings about it belong in the payment-ui repo.
  - path: CHANGELOG_*.md
    instructions: Two changelogs, en-GB and de-DE, must carry the same entries. Unreleased entries under
      `# Unreleased`; release.yml looks for `# <version>`, so the heading is renamed before tagging.
  - path: src/Resources/public/administration/**
    instructions: Built administration assets, generated by `shopware-cli extension build`. Check only
      that they were rebuilt when src/Resources/app/administration changed.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
    - files: ledger-direct/ledger-direct-core-php:INVARIANTS.md
      applyTo: src/*.php,src/Api/**,src/Checkout/**,src/Command/**,src/Components/**,src/Exception/**,src/Installer/**,src/Migration/**,src/Port/**,src/Presentation/**,src/SalesChannel/**,src/ScheduledTask/**,src/Service/**,src/Storefront/**,src/Resources/app/administration/src/**,src/Resources/app/storefront/src/**,src/Resources/config/**,src/Resources/Schema/**,src/Resources/snippet/**,src/Resources/views/**,tests/**
  learnings:
    scope: global
  linked_repositories:
  - repository: ledger-direct/ledger-direct-core-php
    instructions: 'The shared core every plugin adapts: INVARIANTS.md is the payment contract (intent,
      status, settlement, throttle, refusals); src/ holds PaymentIntent, PaymentStatus, SettlementPolicy,
      StablecoinRegistry. A plugin change that contradicts it, or needs a core change, is a finding.'
  - repository: ledger-direct/ledger-direct-payment-ui
    instructions: The payment page script copied into each plugin. Its markup contract (data-ld-* attributes,
      poll URL, status payload) must be what the plugin's template renders and its status endpoint returns.
  - repository: ledger-direct/ledger-direct-e2e
    instructions: End-to-end harness with the payment-status case catalogue (PS-01 ...). Its platform
      driver expects the plugin's routes, compose service names and try stack layout.
